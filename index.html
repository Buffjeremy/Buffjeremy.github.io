
<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>

  <meta charset="utf-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1, shrink-to-fit=no">

  <link rel="stylesheet"
        href="https://stackpath.bootstrapcdn.com/bootstrap/4.2.1/css/bootstrap.min.css"
        integrity="sha384-GJzqZFGwb1QTTN6wy59ffF1BuGJpLSa9DkKMp0DgiMDm4iYMj70gZWKYbI706tWS"
        crossorigin="anonymous">

  <title>Local Shuffle</title>

  <link rel="stylesheet" href="LS.css">

</head>


<body>


  <!-- ==========================================
       NAVIGATION
       ========================================== -->
<a class="active" href="index.html">Home</a>

<a href="ls-bands.html">Bands</a>

<a href="artists.html">Artists</a>

<a href="Business-Application.html">Businesses</a>

<a href="ls-Contact.html">Contact</a>

<a href="ls-about.html">About</a>

  <!-- ==========================================
       TAGLINE
       ========================================== -->

  <div class="Local">

    <h3>
      Local Music ... Local Listeners
    </h3>

  </div>


  <!-- ==========================================
       REDEMPTION AREA
       ========================================== -->

  <div class="holder">

    <label for="myInput">
      Enter your redemption code:
    </label>


    <div class="download-box">

      <input
        id="myInput"
        type="text"
        autocomplete="off"
        placeholder="Redemption Code">


      <button
        id="myButton"
        type="button">

        Download Now!

      </button>

    </div>


    <!-- Status messages -->

    <div
      id="status"
      class="status"
      aria-live="polite">
    </div>


    <!-- Download result -->

    <div
      id="downloadArea"
      class="download-area"
      hidden>

      <h2 id="songTitle">
        Your song is ready!
      </h2>

      <p id="artistName"></p>

      <a
        id="downloadLink"
        class="download-button"
        href="#">

        Download Song

      </a>

    </div>

  </div>


  <!-- ==========================================
       REDEMPTION SCRIPT
       ========================================== -->

  <script src="LS-Switch.js"></script>


</body>

</html>
