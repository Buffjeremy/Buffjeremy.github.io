
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

    <!-- Bootstrap CSS -->
    <link
      rel="stylesheet"
      href="https://stackpath.bootstrapcdn.com/bootstrap/4.2.1/css/bootstrap.min.css"
      integrity="sha384-GJzZqFGwb1QTTN6wy59ffF1BuGJpLSa9DkKMp0DgiMDm4iYMj70gZWKYbI706tWS"
      crossorigin="anonymous"
    >

    <title>Local Shuffle</title>

    <link rel="stylesheet" href="LS-nav.css">
  </head>

  <body>

    <div class="topnav">
      <a class="active" href="#home">Home</a>
      <a href="ls-bands.html">Bands</a>
      <a href="ls-Contact.html">Contact</a>
      <a href="ls-about.html">About</a>
    </div>

    <div class="welcome">
      <h1>Welcome to the Local Shuffle</h1>
    </div>

    <div class="Local">
      <h3>Local Music ... Local Listeners</h3>
    </div>

    <div class="holder">

      <label for="myInput">Enter your redemption code:</label>

      <div class="download-box">
        <input
          id="myInput"
          type="text"
          autocomplete="off"
          placeholder="Redemption Code"
        >

        <button id="myButton" type="button">
          Download Now!
        </button>
      </div>

      <div id="status" class="status" aria-live="polite"></div>

      <div id="downloadArea" class="download-area" hidden>
        <h2 id="songTitle">Your song is ready!</h2>

        <p id="artistName"></p>

        <a id="downloadLink" class="download-button" href="#">
          Download Song
        </a>
      </div>

    </div>

    <!-- Local Shuffle JavaScript -->
    <script src="LS-Switch.js"></script>

  </body>
</html>
