
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Local Shuffle — Business Login</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root {
      --bg: #f2f2f2;
      --card: #ffffff;
      --text: #1a1a1a;
      --muted: #666;
      --accent: #964c4b;
      --accent-dark: #753b3a;
      --border: #ddd;
      --success: #2f6b45;
      --error: #9b3030;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    .container {
      width: min(500px, 92%);
      margin: 60px auto;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 32px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.06);
    }

    h1 {
      margin-top: 0;
      text-align: center;
    }

    .intro {
      text-align: center;
      color: var(--muted);
      line-height: 1.5;
      margin-bottom: 30px;
    }

    h2 {
      font-size: 1.2rem;
      margin-top: 0;
    }

    label {
      display: block;
      margin: 16px 0 6px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 12px;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 1rem;
    }

    button {
      width: 100%;
      margin-top: 20px;
      padding: 13px;
      border: 0;
      border-radius: 6px;
      background: var(--accent);
      color: white;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: var(--accent-dark);
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .section {
      margin-top: 30px;
      padding-top: 30px;
      border-top: 1px solid var(--border);
    }

    .message {
      display: none;
      margin-top: 20px;
      padding: 12px;
      border-radius: 6px;
      line-height: 1.4;
    }

    .message.success {
      display: block;
      background: #e8f4ec;
      color: var(--success);
    }

    .message.error {
      display: block;
      background: #f9e8e8;
      color: var(--error);
    }

    .small {
      color: var(--muted);
      font-size: 0.9rem;
      line-height: 1.4;
      margin-top: 10px;
    }
  </style>
</head>

<body>

  <main class="container">

    <div class="card">

      <h1>Business Account</h1>

      <p class="intro">
        Sign in to your Local Shuffle business account,
        or create an account if you are a new business owner.
      </p>

      <!-- SIGN IN -->
      <section>
        <h2>Already have an account?</h2>

        <form id="login-form">

          <label for="login-email">Email</label>
          <input
            type="email"
            id="login-email"
            required
            autocomplete="email"
          />

          <label for="login-password">Password</label>
          <input
            type="password"
            id="login-password"
            required
            autocomplete="current-password"
          />

          <button type="submit" id="login-button">
            Sign In
          </button>

        </form>
      </section>

      <!-- CREATE ACCOUNT -->
      <section class="section">

        <h2>New business owner?</h2>

        <form id="signup-form">

          <label for="signup-email">Email</label>
          <input
            type="email"
            id="signup-email"
            required
            autocomplete="email"
          />

          <label for="signup-password">Password</label>
          <input
            type="password"
            id="signup-password"
            minlength="8"
            required
            autocomplete="new-password"
          />

          <button type="submit" id="signup-button">
            Create Account
          </button>

          <p class="small">
            Your email address must match the email address
            approved for your Local Shuffle business.
          </p>

        </form>

      </section>

      <div id="message" class="message"></div>

    </div>

  </main>

<script>
  const SUPABASE_URL =
    "https://yaqhqnuvlxfgfpnwufyw.supabase.co";

  const SUPABASE_PUBLISHABLE_KEY =
    "sb_publishable_Lo-gi0FFqCWN6JrZRumUIw_CK3yk9-i";

  const supabaseClient = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
  );

  const message = document.getElementById("message");

  function showMessage(text, type) {
    message.textContent = text;
    message.className = "message " + type;
  }

  function clearMessage() {
    message.textContent = "";
    message.className = "message";
  }

  /*
   * SIGN UP
   */
  document
    .getElementById("signup-form")
    .addEventListener("submit", async (event) => {

      event.preventDefault();
      clearMessage();

      const button = document.getElementById("signup-button");

      const email =
        document.getElementById("signup-email").value
          .trim()
          .toLowerCase();

      const password =
        document.getElementById("signup-password").value;

      button.disabled = true;
      button.textContent = "Creating account...";

      try {

        const { data, error } =
          await supabaseClient.auth.signUp({
            email,
            password
          });

        if (error) {
          throw error;
        }

        /*
         * Supabase may require email confirmation before
         * the user can actually log in.
         */
        if (data.user && !data.session) {

          showMessage(
            "Account created. Please check your email and verify your email address. After verification, return here and sign in.",
            "success"
          );

        } else {

          showMessage(
            "Account created. You can now sign in and claim your business account.",
            "success"
          );

        }

      } catch (error) {

        console.error(error);

        showMessage(
          error.message || "Unable to create your account.",
          "error"
        );

      } finally {

        button.disabled = false;
        button.textContent = "Create Account";

      }
    });


  /*
   * SIGN IN
   */
  document
    .getElementById("login-form")
    .addEventListener("submit", async (event) => {

      event.preventDefault();
      clearMessage();

      const button = document.getElementById("login-button");

      const email =
        document.getElementById("login-email").value
          .trim()
          .toLowerCase();

      const password =
        document.getElementById("login-password").value;

      button.disabled = true;
      button.textContent = "Signing in...";

      try {

        const { data, error } =
          await supabaseClient.auth.signInWithPassword({
            email,
            password
          });

        if (error) {
          throw error;
        }

        if (!data.user) {
          throw new Error("Unable to determine the signed-in user.");
        }

        /*
         * The user is authenticated.
         *
         * Now call our secure Edge Function.
         * The function receives the user's Supabase JWT
         * and determines whether they can claim a business.
         */
        showMessage(
          "Signed in. Checking your business invitation...",
          "success"
        );

        const {
          data: claimData,
          error: claimError
        } = await supabaseClient.functions.invoke(
          "claim-business-account",
          {
            body: {}
          }
        );

        if (claimError) {
          throw claimError;
        }

        if (!claimData || !claimData.success) {

          throw new Error(
            claimData?.error ||
            "You do not currently have an approved business invitation."
          );

        }

        showMessage(
          "Your business account has been successfully claimed!",
          "success"
        );

        /*
         * We will change this to the real business dashboard
         * once we build it.
         */
        setTimeout(() => {
          window.location.href = "business-dashboard.html";
        }, 1200);

      } catch (error) {

        console.error(error);

        showMessage(
          error.message ||
          "Unable to sign in or claim the business account.",
          "error"
        );

      } finally {

        button.disabled = false;
        button.textContent = "Sign In";

      }
    });
</script>

</body>
</html>
